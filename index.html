<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Expense Capture</title>
<style>
:root{--navy:#1f4e78;--bg:#f2f3f5;--card:#fff;--ink:#1c1c1e;--grey:#8a8a8e;--line:#e3e3e8;--accent:#1f4e78}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:120px}
header{position:sticky;top:0;z-index:10;background:var(--navy);color:#fff;padding:max(14px,env(safe-area-inset-top)) 16px 12px}
header h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.2px}
.trip{margin-top:8px;display:flex;gap:8px;align-items:center}
.trip input{flex:1;border:none;border-radius:8px;padding:8px 10px;font-size:15px;background:rgba(255,255,255,.15);color:#fff}
.trip input::placeholder{color:#cdd8e6}
.tot{font-size:15px;font-weight:600;white-space:nowrap}
.wrap{padding:14px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
label{display:block;font-size:12px;font-weight:600;color:var(--grey);text-transform:uppercase;letter-spacing:.4px;margin:12px 0 6px}
label:first-child{margin-top:0}
input[type=number],input[type=text],input[type=date],textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:17px;background:#fff;color:var(--ink)}
textarea{min-height:64px;resize:vertical}
.amt{font-size:30px;font-weight:700;text-align:center;padding:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-size:15px;font-weight:600;color:#333}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.toggle{display:flex;gap:8px}
.toggle button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px;font-size:15px;font-weight:600;color:#333}
.toggle button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.photo-row{display:flex;gap:12px;align-items:center}
.photo-btn{flex:1;border:1.5px dashed #b9c2cf;background:#f7f9fc;border-radius:12px;padding:16px;text-align:center;font-weight:600;color:var(--navy)}
#prev{display:none;width:74px;height:74px;border-radius:10px;object-fit:cover;border:1px solid var(--line)}
.add{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(242,243,245,0),var(--bg) 28%)}
.add .max{max-width:560px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;border:none;border-radius:12px;padding:16px;font-size:17px;font-weight:700;color:#fff;background:var(--navy)}
.btn.sec{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.list h2{font-size:14px;color:var(--grey);text-transform:uppercase;letter-spacing:.4px;margin:6px 2px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.item img{width:52px;height:52px;border-radius:8px;object-fit:cover;background:#eee;flex:none}
.item .ph{width:52px;height:52px;border-radius:8px;background:#eef1f5;display:flex;align-items:center;justify-content:center;color:#9aa6b4;font-size:20px;flex:none}
.item .mid{flex:1;min-width:0}
.item .a{font-weight:700;font-size:17px}
.item .m{font-size:13px;color:var(--grey);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .del{color:#c0392b;font-size:22px;padding:6px 8px;background:none;border:none}
.exp{display:flex;gap:10px;flex-wrap:wrap}
.exp button{flex:1 1 45%;border-radius:12px;padding:14px;font-size:15px;font-weight:700;border:1.5px solid var(--navy);background:#fff;color:var(--navy)}
.exp button.solid{background:var(--navy);color:#fff}
.muted{color:var(--grey);font-size:13px;text-align:center;margin-top:8px}
.empty{text-align:center;color:var(--grey);padding:20px}
</style></head>
<body>
<header>
  <h1>Expense Capture</h1>
  <div class="trip"><input id="trip" placeholder="Trip name (e.g. NGFA Fly-In)"><span class="tot" id="tot">$0.00 · 0</span></div>
</header>
<div class="wrap">
  <div class="card">
    <label>Amount</label>
    <input class="amt" id="amount" type="number" inputmode="decimal" placeholder="$0.00">
    <label>Category</label>
    <div class="chips" id="chips"></div>
    <label>Paid with</label>
    <div class="toggle" id="paid">
      <button data-v="Cash" class="on">Cash / personal</button>
      <button data-v="Company Card">Company card</button>
    </div>
    <label>What was it? (who, if a meal)</label>
    <textarea id="note" placeholder="e.g. Dinner w/ Ty Jessup (Highline) — Blackwall Hitch"></textarea>
    <label>Receipt photo</label>
    <div class="photo-row">
      <button class="photo-btn" id="photoBtn">📷 Add photo</button>
      <img id="prev">
      <input id="file" type="file" accept="image/*" capture="environment" hidden>
    </div>
    <label>City &amp; state · Date</label>
    <div style="display:flex;gap:10px">
      <input id="city" type="text" placeholder="City, ST" style="flex:1">
      <input id="date" type="date" style="flex:1">
    </div>
  </div>

  <div class="list">
    <h2>Captured this trip</h2>
    <div id="items"></div>
  </div>

  <div class="card">
    <div class="exp">
      <button class="solid" id="send">⬆︎ Send / Export</button>
      <button id="dl">⬇︎ Download backup</button>
      <button id="mail">✉︎ Email summary</button>
      <button id="clear">🗑 Clear all</button>
    </div>
    <div class="muted">Saved on this phone automatically. Export drops a file you can save to OneDrive or email — then Claude turns it into your form.</div>
  </div>
</div>
<div class="add"><div class="max">
  <button class="btn sec" id="reset">Clear form</button>
  <button class="btn" id="save">+ Add expense</button>
</div></div>

<script>
var CATS=["Breakfast","Lunch","Dinner","Entertainment","Uber/Taxi","Hotel","Airfare","Parking","Gas","Tolls","Mileage","Other"];
var KEY="expcap_v1";
var state={trip:"",entries:[]}, editId=null, photoData="";
function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s){state=s}}catch(e){}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function money(n){return "$"+(Number(n)||0).toFixed(2)}
function todayISO(){var d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
var $=function(id){return document.getElementById(id)};

// build chips
var chipsEl=$("chips"),selCat="Other";
CATS.forEach(function(c){var b=document.createElement("button");b.className="chip"+(c==="Other"?" on":"");b.textContent=c;b.onclick=function(){selCat=c;[].forEach.call(chipsEl.children,function(x){x.classList.toggle("on",x.textContent===c)})};chipsEl.appendChild(b)});
// paid toggle
var paidEl=$("paid"),selPaid="Cash";
[].forEach.call(paidEl.children,function(b){b.onclick=function(){selPaid=b.dataset.v;[].forEach.call(paidEl.children,function(x){x.classList.toggle("on",x===b)})}});
// photo
$("photoBtn").onclick=function(){$("file").click()};
$("file").onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var img=new Image();img.onload=function(){var m=1400,w=img.width,h=img.height;if(w>m||h>m){if(w>h){h=Math.round(h*m/w);w=m}else{w=Math.round(w*m/h);h=m}}var c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);photoData=c.toDataURL("image/jpeg",0.7);var p=$("prev");p.src=photoData;p.style.display="block"};img.src=r.result};r.readAsDataURL(f)};

function render(){
  $("trip").value=state.trip||"";
  var t=state.entries.reduce(function(a,e){return a+(Number(e.amount)||0)},0);
  $("tot").textContent=money(t)+" · "+state.entries.length;
  var box=$("items");box.innerHTML="";
  if(!state.entries.length){box.innerHTML='<div class="empty">No expenses yet — add your first above.</div>';return}
  state.entries.slice().reverse().forEach(function(e){
    var d=document.createElement("div");d.className="item";
    var thumb=e.photo?('<img src="'+e.photo+'">'):'<div class="ph">🧾</div>';
    d.innerHTML=thumb+'<div class="mid"><div class="a">'+money(e.amount)+' · '+e.category+'</div><div class="m">'+(e.note||"")+'</div><div class="m">'+e.date+(e.city?(" · "+e.city):"")+" · "+e.paid+'</div></div><button class="del">&times;</button>';
    d.querySelector(".del").onclick=function(ev){ev.stopPropagation();if(confirm("Delete this expense?")){state.entries=state.entries.filter(function(x){return x.id!==e.id});save();render()}};
    d.onclick=function(){editEntry(e)};
    box.appendChild(d)
  })
}
function resetForm(){editId=null;photoData="";$("amount").value="";$("note").value="";$("prev").style.display="none";$("file").value="";$("save").textContent="+ Add expense";if(!$("date").value)$("date").value=todayISO()}
function editEntry(e){editId=e.id;$("amount").value=e.amount;$("note").value=e.note||"";$("city").value=e.city||"";$("date").value=e.date;selCat=e.category;[].forEach.call(chipsEl.children,function(x){x.classList.toggle("on",x.textContent===e.category)});selPaid=e.paid;[].forEach.call(paidEl.children,function(x){x.classList.toggle("on",x.dataset.v===e.paid)});photoData=e.photo||"";var p=$("prev");if(photoData){p.src=photoData;p.style.display="block"}else{p.style.display="none"}$("save").textContent="✓ Update expense";window.scrollTo(0,0)}

$("save").onclick=function(){
  var amt=parseFloat($("amount").value);
  if(!(amt>0)){alert("Enter an amount.");return}
  var rec={id:editId||Date.now(),date:$("date").value||todayISO(),city:$("city").value.trim(),category:selCat,amount:amt,paid:selPaid,note:$("note").value.trim(),photo:photoData};
  if(editId){state.entries=state.entries.map(function(x){return x.id===editId?rec:x})}else{state.entries.push(rec)}
  save();resetForm();render()
};
$("reset").onclick=resetForm;
$("trip").oninput=function(){state.trip=$("trip").value;save()};
$("city").onchange=function(){localStorage.setItem("expcap_city",$("city").value)};

function exportObj(){return {trip:state.trip||"Trip",exported:new Date().toISOString(),count:state.entries.length,total:state.entries.reduce(function(a,e){return a+(Number(e.amount)||0)},0),entries:state.entries}}
function fname(ext){return (state.trip||"expenses").replace(/[^a-z0-9]+/ig,"-")+"-"+todayISO()+"."+ext}
function blobFile(){return new File([JSON.stringify(exportObj(),null,2)],fname("json"),{type:"application/json"})}
$("send").onclick=async function(){
  if(!state.entries.length){alert("Nothing to export yet.");return}
  var file=blobFile();
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:state.trip||"Expenses",text:"Expense capture export"});return}catch(e){if(e&&e.name==="AbortError")return}}
  dl()
};
function dl(){var a=document.createElement("a");a.href=URL.createObjectURL(blobFile());a.download=fname("json");document.body.appendChild(a);a.click();a.remove()}
$("dl").onclick=function(){if(!state.entries.length){alert("Nothing to export yet.");return}dl()};
$("mail").onclick=function(){
  if(!state.entries.length){alert("Nothing to export yet.");return}
  var o=exportObj(),lines=o.entries.map(function(e){return "• "+e.date+"  "+money(e.amount)+"  "+e.category+(e.paid==="Company Card"?" [card]":"")+"  — "+(e.note||"")+(e.city?(" ("+e.city+")"):"")}).join("\n");
  var body="Trip: "+o.trip+"\nTotal: "+money(o.total)+" ("+o.count+" items)\n\n"+lines+"\n\n(Photos are in the app — use Send/Export to include them.)";
  location.href="mailto:?subject="+encodeURIComponent("Expenses — "+o.trip)+"&body="+encodeURIComponent(body)
};
$("clear").onclick=function(){if(confirm("Clear ALL captured expenses on this phone? Export first if you need them.")){state.entries=[];save();render()}};

load();if(!$("date").value)$("date").value=todayISO();var lc=localStorage.getItem("expcap_city");if(lc)$("city").value=lc;render();resetForm();
</script>
</body></html>
